name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build plug-in
        uses: nsis-dev/release-package@489fbb8cb19ff58dfd029c50b5cc0c5d693e576f # v0.4.1
        with:
          name: nsisunz
          sources: |
            Contrib/nsisunz/zlib/ADLER32.C
            Contrib/nsisunz/zlib/CRC32.C
            Contrib/nsisunz/zlib/INFFAST.C
            Contrib/nsisunz/zlib/INFLATE.C
            Contrib/nsisunz/zlib/INFTREES.C
            Contrib/nsisunz/zlib/Unzip.c
            Contrib/nsisunz/zlib/Zutil.c
          strict: false
          release: ${{ github.event_name == 'release' }}
